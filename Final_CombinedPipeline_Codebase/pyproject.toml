[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-audio-dsp"
version = "0.1.0"
description = "Causal, sensor-optional drone audio research pipeline"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "PyYAML>=6,<7"]

[project.optional-dependencies]
analysis = ["matplotlib>=3.7,<4", "pystoi>=0.4.1,<1"]
test = ["pytest>=8,<10"]

[project.scripts]
drone-audio = "drone_audio.cli:main"

[tool.setuptools.packages.find]
include = ["drone_audio*"]

[tool.setuptools.package-data]
drone_audio = ["assets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
